name: Auto assign Pull Request
on:
  pull_request:
      types:
      - opened

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Assign the PR to a user
      uses: kentaro-m/auto-assign-action@v2.0.0
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
